name: rg

# Production stack. The Express server serves both the built site and the
# API, so one container is the whole application.
#
#   docker compose up -d --build      start
#   docker compose logs -f            follow logs
#   docker compose down               stop
#
# Copy .env.example to .env and set ADMIN_TOKEN before exposing this.

services:
  app:
    build: .
    image: rg-site:latest
    restart: unless-stopped
    init: true
    ports:
      - "${HOST_PORT:-4000}:4000"
    environment:
      # Guards the write endpoints that /admin uses. Empty = unprotected.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # The site and API share an origin here, so this only matters if you
      # call the API from another domain.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${HOST_PORT:-4000}}
      # Largest image or video /admin may upload, in megabytes.
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      # Public address of the site, used for canonical links and link
      # previews. Falls back to the requesting host when unset.
      SITE_URL: ${SITE_URL:-}
    volumes:
      # db.json and the uploaded images and videos live here. Without this
      # volume, every rebuild resets the site's content back to the seed
      # data and loses the uploads.
      - rg-data:/app/data

volumes:
  rg-data:
